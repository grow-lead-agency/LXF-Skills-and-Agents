# Deploy pipeline for a Laravel + MySQL app to a single VPS via Deployer.
# Copy to .github/workflows/deploy.yml, then edit the "EDIT ME" values.
#
# Stages: build -> deploy-staging (auto on push to main) -> deploy-prod (manual approval gate)
#
# Design decisions (see SKILL.md + references/db-changes.md for the "why"):
# - Build ONCE in CI (composer --no-dev -o, npm run build), upload the built tree as a single
#   artifact, and deploy that same artifact to staging and prod. Never build twice — a second
#   `composer install`/`npm run build` on the server (or in a second CI job) can silently
#   produce a different lockfile resolution or a different Vite manifest than what was tested.
# - Deployer's default `update_code_strategy` (archive/clone) re-fetches from the git remote on
#   the server. That means the server, not CI, runs the build — which is exactly what this
#   workflow avoids. `deploy.php` below overrides `deploy:update_code` to upload the prebuilt
#   CI artifact instead (see deploy.php diff guidance further down + deployer-php skill for the
#   stock recipe this replaces).
# - `dep` runs as a pinned phar (checksum-verified), not `composer require --dev deployer/deployer`
#   — keeps the deploy tool out of the app's own dependency tree and its own audit surface.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false # never cancel a deploy mid-flight — let it finish or fail cleanly

permissions:
  contents: read

env:
  PHP_VERSION: "8.3" # EDIT ME — must match ci.yml and the production server
  NODE_VERSION: "20"
  # EDIT ME — pin the Deployer phar version. Bump deliberately, re-verify the signature.
  DEPLOYER_VERSION: "8.0.5"

jobs:
  build:
    name: Build artifact
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, dom, gd, libxml, soap, mbstring, mysql, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Composer install (production deps only, optimized autoloader)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
        # finding: `composer install --dev` on a production server pulls in
        # Laravel Boost / Debugbar / Pint / PHPUnit into the release tree. Building in CI with
        # a strict `--no-dev` step makes that class of mistake structurally impossible.

      - name: npm ci
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove dev-only / VCS cruft from the artifact
        run: |
          rm -rf node_modules .git tests
          # keep vendor/ and public/build/ — that's the whole point of this step

      - name: Package artifact
        run: tar -czf release.tar.gz --exclude=release.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: staging
      url: https://staging.example.com # EDIT ME
    steps:
      - name: Checkout (for deploy.php + terraform-managed known_hosts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Setup PHP (for the dep phar)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install Deployer (pinned phar)
        run: |
          curl -sSLo dep.phar "https://deployer.org/releases/v${{ env.DEPLOYER_VERSION }}/deployer.phar"
          curl -sSLo dep.phar.asc "https://deployer.org/releases/v${{ env.DEPLOYER_VERSION }}/deployer.phar.asc"
          # verify GPG signature — see deployer.org/download for the maintainers' public key
          gpg --keyserver keyserver.ubuntu.com --recv-keys 0x5A7A5B77 || true
          gpg --verify dep.phar.asc dep.phar
          chmod +x dep.phar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_STAGING }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts


      - name: Deploy (artifact upload, migrate, cache, reload)
        run: php dep.phar deploy staging -f deploy.php -v
        env:
          DEPLOY_ARTIFACT: release.tar.gz

      - name: Smoke test
        run: |
          curl -sf --retry 5 --retry-delay 5 https://staging.example.com/up # EDIT ME

      - name: Rollback on failure
        if: failure()
        run: php dep.phar rollback staging -f deploy.php

      - name: Post-rollback service restart
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.STAGING_HOST }} \
            'sudo systemctl reload php8.3-fpm && sudo supervisorctl restart laravel-worker:*'

  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: production # GitHub Environment with required reviewers — THIS is the human gate.
      url: https://example.com # EDIT ME
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Setup PHP (for the dep phar)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install Deployer (pinned phar)
        run: |
          curl -sSLo dep.phar "https://deployer.org/releases/v${{ env.DEPLOYER_VERSION }}/deployer.phar"
          curl -sSLo dep.phar.asc "https://deployer.org/releases/v${{ env.DEPLOYER_VERSION }}/deployer.phar.asc"
          gpg --keyserver keyserver.ubuntu.com --recv-keys 0x5A7A5B77 || true
          gpg --verify dep.phar.asc dep.phar
          chmod +x dep.phar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts


      - name: Deploy (artifact upload, migrate --force, cache, reload)
        run: php dep.phar deploy production -f deploy.php -v

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 5 https://example.com/up # EDIT ME

      - name: Rollback on failure
        if: failure()
        run: php dep.phar rollback production -f deploy.php

      - name: Post-rollback service restart
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.PROD_HOST }} \
            'sudo systemctl reload php8.3-fpm && sudo supervisorctl restart laravel-worker:*'

      - name: Notify Teams
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -sf -X POST "${{ secrets.TEAMS_WORKFLOW_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"Production deploy ${STATUS} for ${{ github.repository }}@${{ github.sha }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          # Teams WORKFLOWS webhook (Power Automate), not the deprecated O365 Connector webhook
          # — Microsoft is retiring Connectors; see references/staging.md gotcha list.
