# Enhanced Quality Gate job for GitHub Actions
# Replaces the minimal "quality" job from deploy-workflow templates
# Copy into your .github/workflows/deploy.yml
#
# Features over baseline:
# - Separate steps for tsc, lint, test (clearer failure diagnosis)
# - Conditional supabase test db (only if supabase/tests/ exists)
# - Vitest GitHub reporter for inline PR annotations
# - Optional coverage upload

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: G1a — Type check
        run: npx tsc --noEmit

      - name: G1b — Lint
        run: npm run lint

      - name: G1c — Unit & Integration tests
        run: npm test
        env:
          CI: true

      - name: G1d — Supabase DB tests (pgTAP)
        if: hashFiles('supabase/tests/**') != ''
        run: |
          # Install Supabase CLI
          npm install -g supabase
          supabase start
          supabase test db
          supabase stop

      - name: G1e — E2E tests (Playwright)
        if: hashFiles('e2e/**') != '' || hashFiles('playwright.config.*') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Optional: coverage upload (uncomment if using Codecov)
      # - name: Upload coverage
      #   if: env.CODECOV_TOKEN != ''
