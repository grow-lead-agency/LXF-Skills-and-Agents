# Full-stack quality gate for Laravel 11 + MySQL 8, NestJS GraphQL, and React + Vite
# Assumes Composer and npm manifests are at the repository root. Adjust workspace script
# names if the BFF and frontend use different root-level orchestration commands.

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app_testing
          MYSQL_USER: app_testing
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          tools: composer:2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Laravel migrations
        run: php artisan migrate --force
        env: &laravel-test-env
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app_testing
          DB_USERNAME: app_testing
          DB_PASSWORD: test-only-password

      - name: PHPUnit 11 — Laravel unit and feature tests
        run: vendor/bin/phpunit
        env: *laravel-test-env

      - name: Type check Node workspaces
        run: npm run typecheck --if-present

      - name: Lint Node workspaces
        run: npm run lint --if-present

      - name: NestJS/Jest and React/Vitest suites
        run: npm test
        env:
          CI: true

      - name: Coverage
        run: npm run test:coverage --if-present
        env:
          CI: true

      - name: E2E tests
        if: hashFiles('e2e/**') != '' || hashFiles('playwright.config.*') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
